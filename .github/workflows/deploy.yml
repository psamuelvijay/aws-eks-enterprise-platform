name: Deploy Portfolio to S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync files to S3
        run: |
          aws s3 sync . s3://psamuelvijay-portfolio \
            --exclude "*" \
            --include "index.html" \
            --include "css/*" \
            --include "js/*" \
            --delete \
            --cache-control "max-age=31536000,public" \
            --metadata-directive REPLACE

          # Set shorter cache for index.html so updates propagate quickly
          aws s3 cp index.html s3://psamuelvijay-portfolio/index.html \
            --content-type "text/html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EXKIGKQ3L0VXL \
            --paths "/*"

      - name: Print live URL
        run: echo "Deployed to https://d3vx9cs0hyk6sf.cloudfront.net"
